<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>xemantic-markdown-editor</title>
  <link href="https://cdn.jsdelivr.net/npm/beercss@4.0.21/dist/cdn/beer.min.css" rel="stylesheet">
  <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@4.0.21/dist/cdn/beer.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/temml@0.13.2/dist/Temml-Local.css" rel="stylesheet">
  <style>
    body:has(> main) {
      block-size: 100dvh;
    }

    main.responsive {
      min-block-size: 0;
      block-size: 100%;
    }

    main.responsive > .grid {
      block-size: 100%;
      min-block-size: 0;
    }

    main.responsive > .grid > section {
      block-size: 100%;
      min-block-size: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    main.responsive > .grid > section > * {
      flex: 1 1 0;
      min-block-size: 0;
    }

    .x-editor {
      height: 100%;
      width: 100%;
      resize: none;
    }

    .x-preview img {
      width: 100%;
    }

    .x-preview {
      --h1-size: 2em;
      --h2-size: 1.6em;
      --h3-size: 1.37em;
      --h4-size: 1.25em;
      --h5-size: 1.12em;
      --h6-size: 1.12em;
      --h1-weight: 700;
      --h2-weight: 600;
      --h3-weight: 600;
      --h4-weight: 600;
      --h5-weight: 600;
      --h6-weight: 600;
      --h1-line-height: 1.5;
      --h2-line-height: 1.5;
      --h3-line-height: 1.5;
      --h4-line-height: 1.5;
      --h5-line-height: 1.5;
      --h6-line-height: 1.5;
      --heading-spacing: 2.5em;
    }

    .x-preview :is(h1, h2, h3, h4, h5, h6) {
      margin-block: var(--heading-spacing) 0;
    }

    .x-preview h1 { font-size: var(--h1-size); font-weight: var(--h1-weight); line-height: var(--h1-line-height); }
    .x-preview h2 { font-size: var(--h2-size); font-weight: var(--h2-weight); line-height: var(--h2-line-height); }
    .x-preview h3 { font-size: var(--h3-size); font-weight: var(--h3-weight); line-height: var(--h3-line-height); }
    .x-preview h4 { font-size: var(--h4-size); font-weight: var(--h4-weight); line-height: var(--h4-line-height); }
    .x-preview h5 { font-size: var(--h5-size); font-weight: var(--h5-weight); line-height: var(--h5-line-height); }
    .x-preview h6 { font-size: var(--h6-size); font-weight: var(--h6-weight); line-height: var(--h6-line-height); }
  </style>
</head>
<body>
  <script src="xemantic-markdown-editor.js"></script>
</body>
</html>
