<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>xemantic-markdown-editor</title>
  <link href="https://cdn.jsdelivr.net/npm/beercss@4.0.21/dist/cdn/beer.min.css" rel="stylesheet">
  <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@4.0.21/dist/cdn/beer.min.js"></script>
  <style>
    body:has(> main) {
      block-size: 100dvh;
    }

    main.responsive {
      min-block-size: 0;
      block-size: 100%;
    }

    main.responsive > .grid {
      block-size: 100%;
      min-block-size: 0;
    }

    main.responsive > .grid > section {
      block-size: 100%;
      min-block-size: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    main.responsive > .grid > section > * {
      flex: 1 1 0;
      min-block-size: 0;
    }

    .x-editor {
      height: 100%;
      width: 100%;
      resize: none;
    }

    .x-preview img {
      width: 100%;
    }
  </style>
</head>
<body>
  <script src="xemantic-markdown-editor.js"></script>
</body>
</html>
