<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Editor - Kotlin JS</title>
  <style>
    /* ---- Reset & Base ---- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: #1e1e1e;
      color: #dcddde;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }

    /* ---- App Layout ---- */
    .obsidian-editor {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: #1e1e1e;
      overflow-y: auto;
    }

    .obsidian-content {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 48px 40px 120px;
      flex: 1;
    }

    /* ---- Block Styles ---- */
    .obsidian-block {
      position: relative;
      margin-bottom: 0;
    }

    .block-preview {
      cursor: text;
      min-height: 1.6em;
      padding: 2px 0;
      border-radius: 3px;
    }

    .block-preview:hover {
      background-color: rgba(255, 255, 255, 0.03);
    }

    .block-textarea {
      display: block;
      width: 100%;
      min-height: 1.6em;
      background-color: #252525;
      color: #dcddde;
      border: 1px solid #3d3d3d;
      border-radius: 4px;
      outline: none;
      resize: none;
      padding: 6px 8px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
      font-size: 14px;
      line-height: 1.7;
      caret-color: #7c8cf8;
      tab-size: 4;
      field-sizing: content;
    }

    .block-textarea::selection {
      background-color: #264f78;
    }

    /* ---- Markdown Rendered Styles ---- */
    .block-preview h1,
    .block-preview h2,
    .block-preview h3,
    .block-preview h4,
    .block-preview h5,
    .block-preview h6 {
      color: #e8e8e8;
      font-weight: 600;
      line-height: 1.3;
      margin-top: 0.5em;
      margin-bottom: 0.25em;
    }

    .block-preview h1 { font-size: 2em; border-bottom: 1px solid #3a3a3a; padding-bottom: 0.3em; }
    .block-preview h2 { font-size: 1.5em; border-bottom: 1px solid #3a3a3a; padding-bottom: 0.3em; }
    .block-preview h3 { font-size: 1.25em; }
    .block-preview h4 { font-size: 1em; }
    .block-preview h5 { font-size: 0.875em; }
    .block-preview h6 { font-size: 0.85em; color: #a0a0a0; }

    .block-preview p {
      margin-bottom: 0;
    }

    .block-preview a {
      color: #7c8cf8;
      text-decoration: none;
    }

    .block-preview a:hover {
      text-decoration: underline;
    }

    .block-preview strong {
      color: #e8e8e8;
      font-weight: 600;
    }

    .block-preview em {
      color: #dcddde;
      font-style: italic;
    }

    .block-preview code {
      background-color: #2d2d2d;
      color: #e6db74;
      padding: 0.1em 0.4em;
      border-radius: 3px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
      font-size: 0.875em;
    }

    .block-preview pre {
      background-color: #2d2d2d;
      border-radius: 6px;
      padding: 16px;
      overflow-x: auto;
    }

    .block-preview pre code {
      background-color: transparent;
      padding: 0;
      color: #f8f8f2;
      font-size: 0.875em;
      border-radius: 0;
    }

    .block-preview blockquote {
      border-left: 4px solid #7c8cf8;
      padding-left: 16px;
      margin-left: 0;
      color: #a0a0a0;
    }

    .block-preview ul,
    .block-preview ol {
      padding-left: 2em;
    }

    .block-preview li {
      margin-bottom: 0.25em;
    }

    .block-preview li > ul,
    .block-preview li > ol {
      margin-top: 0.25em;
      margin-bottom: 0;
    }

    .block-preview hr {
      border: none;
      border-top: 1px solid #3a3a3a;
      margin: 0.5em 0;
    }

    .block-preview table {
      border-collapse: collapse;
      width: 100%;
    }

    .block-preview th,
    .block-preview td {
      border: 1px solid #3a3a3a;
      padding: 8px 12px;
      text-align: left;
    }

    .block-preview th {
      background-color: #2d2d2d;
      color: #e8e8e8;
      font-weight: 600;
    }

    .block-preview tr:nth-child(even) {
      background-color: #252525;
    }

    .block-preview img {
      max-width: 100%;
      border-radius: 4px;
    }

    /* ---- Vertical spacing between blocks ---- */
    .obsidian-block + .obsidian-block {
      margin-top: 0.75em;
    }

    /* ---- Scrollbar Styling ---- */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #1e1e1e;
    }

    ::-webkit-scrollbar-thumb {
      background: #3a3a3a;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #4a4a4a;
    }
  </style>
</head>
<body>
  <script src="xemantic-markdown-editor.js"></script>
</body>
</html>
